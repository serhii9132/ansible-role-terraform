---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name: "{{ __terraform_dependencies }}"
    update_cache: true

- name: Add the repository to APT sources
  ansible.builtin.deb822_repository:
    name: terraform
    types: ["deb"]
    uris: "{{ __terraform_base_url }}"
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: "{{ __terraform_gpg_key_url }}"
    architectures: amd64
    enabled: true

- name: Install Terraform
  ansible.builtin.apt:
    name: terraform
    update_cache: true

- name: Add autocompletion for Terraform
  ansible.builtin.lineinfile:
    path: ~/.bashrc
    line: "complete -C /usr/bin/terraform terraform"
    state: present
